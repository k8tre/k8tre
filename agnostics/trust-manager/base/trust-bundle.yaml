apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: k8tre-ca-bundle
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        name: k8tre-root-ca-secret
        key: ca.crt
  target:
    configMap:
      key: ca-certificates.crt
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: k8tre-root-ca
spec:
  sources:
    - secret:
        name: k8tre-root-ca-secret
        key: ca.crt
  target:
    configMap:
      key: k8tre-ca.crt
