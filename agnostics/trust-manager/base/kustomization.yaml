apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - trust-bundle.yaml

helmCharts:
  - name: trust-manager
    repo: https://charts.jetstack.io
    version: v0.26.0
    releaseName: trust-manager
    namespace: cert-manager
    valuesInline:
      crds:
        enabled: true
      app:
        trust:
          namespace: cert-manager
        webhook:
          tls:
            approverPolicy:
              enabled: false
