apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-auth-proxy
  namespace: jupyterhub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guacamole-auth-proxy
  template:
    metadata:
      labels:
        app: guacamole-auth-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        command: ["nginx", "-g", "daemon off;"]
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: config-template
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf.template
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      volumes:
      - name: config-template
        configMap:
          name: guacamole-auth-proxy-nginx-template
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole-auth-proxy
  namespace: jupyterhub
spec:
  selector:
    app: guacamole-auth-proxy
  ports:
  - name: http
    port: 8080
    targetPort: 8080
