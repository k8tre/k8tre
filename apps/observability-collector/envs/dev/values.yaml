# Gateway-mode deployment: TRE services point their OTLP exporters at
# otel-collector.observability.svc.cluster.local:4317 (gRPC) or :4318 (HTTP).
# The collector enriches telemetry with k8s metadata, then fans out to
# Tempo (traces), Loki (logs), and Prometheus (metrics).
mode: deployment
replicaCount: 1

# Required since chart 0.108.0 — no default image; contrib needed for
# k8sattributes, prometheusremotewrite, and otlphttp exporters.
image:
  repository: otel/opentelemetry-collector-contrib

serviceAccount:
  create: true
  name: otel-collector

# Expose OTLP ports as a ClusterIP service so TRE services can reach the collector
service:
  enabled: true
  type: ClusterIP

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
    appProtocol: grpc
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 5s
      limit_mib: 400
      spike_limit_mib: 100

    # Attach k8s metadata (namespace, pod name, deployment) to every signal.
    # Requires the ClusterRole defined in base/rbac.yaml.
    k8sattributes:
      auth_type: serviceAccount
      passthrough: false
      extract:
        metadata:
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.deployment.name
          - k8s.namespace.name
          - k8s.node.name
          - k8s.pod.start_time
        labels:
          - tag_name: app.kubernetes.io/name
            key: app.kubernetes.io/name
            from: pod
          - tag_name: app.kubernetes.io/component
            key: app.kubernetes.io/component
            from: pod
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.ip
        - sources:
            - from: resource_attribute
              name: k8s.pod.uid
        - sources:
            - from: connection

    batch:
      timeout: 5s
      send_batch_size: 1000

  exporters:
    # Traces → Tempo via OTLP gRPC
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true

    # Logs → Loki via native OTLP HTTP endpoint (Loki 3.x+)
    otlphttp/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
      tls:
        insecure: true

    # Metrics → Prometheus remote write receiver
    prometheusremotewrite:
      endpoint: http://prometheus-community-kube-prometheus.observability.svc.cluster.local:9090/api/v1/write
      tls:
        insecure: true

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlp/tempo]

      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/loki]

      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [prometheusremotewrite]
