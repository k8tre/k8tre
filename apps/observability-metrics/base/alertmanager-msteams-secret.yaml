apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-alertmanager-msteams
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: observability-alertmanager-msteams
  data:
    - secretKey: webhook_url
      remoteRef:
        key: observability-alertmanager-msteams
        property: webhook_url
