        {
          "id": 31,
          "type": "bargauge",
          "title": "Relevant Critical CVEs by Namespace",
          "description": "Runtime-relevant critical CVEs per namespace — these are the ones that actually matter",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
