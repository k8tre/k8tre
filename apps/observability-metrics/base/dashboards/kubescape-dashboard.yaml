        },
        {
          "id": 24,
          "type": "stat",
          "title": "Critical CVEs (Relevant — Runtime-loaded)",
          "description": "Critical CVEs in packages actually loaded at runtime, filtered by Kubescape relevancy engine",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
