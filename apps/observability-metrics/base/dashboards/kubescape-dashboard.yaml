apiVersion: v1
kind: ConfigMap
metadata:
  name: kubescape-dashboard-cm
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  kubescape-dashboard.json: |
    {
      "title": "Kubescape Security Posture",
      "uid": "kubescape-posture",
      "description": "Configuration scan and vulnerability scan results from the Kubescape operator prometheus exporter",
      "tags": ["kubescape", "security", "compliance"],
      "editable": true,
      "graphTooltip": 1,
      "refresh": "5m",
      "schemaVersion": 38,
      "time": { "from": "now-24h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "pluginId": "prometheus",
            "label": "Datasource",
            "current": { "text": "prometheus", "value": "prometheus" },
            "hide": 0,
            "includeAll": false,
            "options": [],
            "query": "prometheus",
            "refresh": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Configuration Scanning — Cluster Totals",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Critical Controls Failing",
          "description": "Total config controls failing at Critical severity across the cluster",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "dark-red" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "dark-red", "value": null }] },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "kubescape_controls_total_cluster_critical",
              "legendFormat": "Critical",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "High Controls Failing",
          "description": "Total config controls failing at High severity across the cluster",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "orange" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "orange", "value": null }] },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "kubescape_controls_total_cluster_high",
              "legendFormat": "High",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Medium Controls Failing",
          "description": "Total config controls failing at Medium severity across the cluster",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "yellow" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "yellow", "value": null }] },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "kubescape_controls_total_cluster_medium",
              "legendFormat": "Medium",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Low Controls Failing",
          "description": "Total config controls failing at Low severity across the cluster",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "blue" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "kubescape_controls_total_cluster_low",
              "legendFormat": "Low",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "type": "row",
          "title": "Configuration Scanning — By Namespace",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 }
        },
        {
          "id": 11,
          "type": "bargauge",
          "title": "High Config Failures by Namespace",
          "description": "Number of High-severity config controls failing per namespace",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "orange" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 5 },
                  { "color": "orange", "value": 10 },
                  { "color": "red", "value": 20 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showUnfilled": true,
            "valueMode": "color",
            "minVizHeight": 10,
            "minVizWidth": 0,
            "namePlacement": "auto",
            "text": {}
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sort_desc(kubescape_controls_total_namespace_high)",
              "legendFormat": "{{exported_namespace}}",
              "refId": "A",
              "instant": true
            }
          ]
        },
        {
          "id": 12,
          "type": "bargauge",
          "title": "Medium Config Failures by Namespace",
          "description": "Number of Medium-severity config controls failing per namespace",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "yellow" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 10 },
                  { "color": "orange", "value": 25 },
                  { "color": "red", "value": 40 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showUnfilled": true,
            "valueMode": "color",
            "minVizHeight": 10,
            "minVizWidth": 0,
            "namePlacement": "auto",
            "text": {}
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sort_desc(kubescape_controls_total_namespace_medium)",
              "legendFormat": "{{exported_namespace}}",
              "refId": "A",
              "instant": true
            }
          ]
        },
        {
          "id": 20,
          "type": "row",
          "title": "Vulnerability Scanning — Cluster Totals",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 }
        },
        {
          "id": 21,
          "type": "stat",
          "title": "Critical CVEs (Total)",
          "description": "Total CVEs at Critical severity found in scanned images",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "dark-red" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "dark-red", "value": null }] },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "kubescape_vulnerabilities_total_cluster_critical",
              "legendFormat": "Critical",
              "refId": "A"
            }
          ]
        },
        {
          "id": 22,
          "type": "stat",
          "title": "High CVEs (Total)",
          "description": "Total CVEs at High severity found in scanned images",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "orange" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "orange", "value": null }] },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "kubescape_vulnerabilities_total_cluster_high",
              "legendFormat": "High",
              "refId": "A"
            }
          ]
        },
        {
          "id": 23,
          "type": "stat",
          "title": "Medium CVEs (Total)",
          "description": "Total CVEs at Medium severity found in scanned images",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "yellow" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "yellow", "value": null }] },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "kubescape_vulnerabilities_total_cluster_medium",
