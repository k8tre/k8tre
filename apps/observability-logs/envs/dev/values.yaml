# Loki in SingleBinary mode for dev — single replica, local filesystem storage.
# For stg/prd, switch to distributed/scalable mode with object storage.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

  ingester:
    chunk_idle_period: 30m
    max_chunk_age: 1h

  rulerConfig:
    alertmanager_url: http://prometheus-community-kube-alertmanager.observability.svc.cluster.local:9093
    enable_alertmanager_v2: true
    external_labels:
      env: ${ENVIRONMENT}
      domain: ${DOMAIN}
    storage:
      type: local
      local:
        directory: /rules
    rule_path: /tmp/loki-rules-scratch
    ring:
      kvstore:
        store: inmemory
    enable_api: true

  limits_config:
    retention_period: 168h  # 7 days
    allow_structured_metadata: true
    # Index these OTEL resource attributes as Loki stream labels for efficient querying
    otlp_config:
      resource_attributes:
        attributes_config:
          - action: index_label
            attributes:
              - service.name
              - service.namespace
              - k8s.namespace.name
              - k8s.pod.name
              - k8s.deployment.name
              - k8s.cluster.name
              - k8s.cluster.domain

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: "rwo-default"
    size: 1Gi
  extraVolumes:
    - name: loki-rules
      configMap:
        name: loki-alert-rules
  extraVolumeMounts:
    # "fake" is the tenant ID when auth_enabled: false
    - name: loki-rules
      mountPath: /rules/fake

# Scale down unused distributed-mode components
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
  serviceMonitor:
    enabled: false

# Disable memcached caching — not needed in dev, causes Pending pods on resource-constrained clusters
chunksCache:
  enabled: false

resultsCache:
  enabled: false

test:
  enabled: false

# Disable gateway — services reach Loki directly via ClusterIP
gateway:
  enabled: false
